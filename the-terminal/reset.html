<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset The Terminal</title>
    <style>
        body {
            background: #000;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            border: 2px solid #00ff41;
            padding: 40px;
            max-width: 500px;
        }
        h1 {
            margin: 0 0 20px 0;
        }
        button {
            background: #00ff41;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #00cc33;
        }
        .success {
            color: #00ff41;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>RESET THE TERMINAL</h1>
        <p>Clicca il pulsante per resettare il gioco e ricominciare dalla selezione della lingua.</p>
        <button onclick="resetGame()">RESET GIOCO</button>
        <button onclick="goToGame()">VAI AL GIOCO</button>
        <p class="success" id="success">✓ Reset completato! Ora vai al gioco.</p>
    </div>

    <script>
        function resetGame() {
            localStorage.removeItem('languageSelected');
            localStorage.removeItem('gameLingua');
            localStorage.removeItem('terminal_options');
            localStorage.removeItem('gameState');
            document.getElementById('success').style.display = 'block';
            console.log('Game reset complete!');
        }

        function goToGame() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
